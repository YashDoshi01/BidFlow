# NGINX in front of two (or more) identical API instances (ADR-034).
#
#   /api/*        -> REST (the /api prefix is removed before the request reaches the API)
#   /socket.io/*  -> WebSocket (Upgrade headers, long timeouts)
#   /nginx-health -> NGINX's own liveness
#   everything else -> the built React app (single-page application fallback)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # JSON log lines to stdout so they can be read next to the API logs.
  log_format json escape=json '{"time":"$time_iso8601","source":"nginx","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,'
                              '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
                              '"request_time":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Sent by a WebSocket client; turned into the Connection header the upstream expects.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api {
    # WebSockets live for hours, so spread by the number of OPEN connections, not by request
    # count (round-robin would balance new connections but not long-lived ones).
    #
    # NO sticky sessions (ip_hash, hash, sticky cookie): the Socket.IO clients use the WebSocket
    # transport only, so a session is ONE connection to ONE instance. Stickiness is needed for
    # the HTTP long-polling transport (several requests that must reach the same process);
    # it is switched off, and a test proves any instance can accept any connection. After a drop,
    # a client reconnects as a brand-new session wherever the balancer sends it, and re-joins.
    #
    # `zone` puts the balancer's counters in shared memory. Without it EVERY worker process keeps
    # its own count of open connections, so with several workers each one sees an "empty" cluster
    # and picks the first server: found by the cluster test (9 of 10 sockets landed on api1).
    zone api 64k;
    least_conn;
    server api1:3000 max_fails=2 fail_timeout=5s;
    server api2:3000 max_fails=2 fail_timeout=5s;
    keepalive 16;
  }

  server {
    listen 80;

    # The API refuses bodies over 16 KB itself; refuse them earlier here too.
    client_max_body_size 32k;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # NEVER add `non_idempotent` here: nginx would then retry a POST (a bid) on another
      # instance after a timeout. By default it retries only idempotent requests (GET); a
      # POST that may have reached the API is left to the client, which retries with the
      # same Idempotency-Key.
      proxy_next_upstream error timeout;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # An idle WebSocket would be cut by the default 60 s read timeout. Socket.IO pings every
      # 25 s, so any value above that works; one hour is a generous ceiling.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      # Single-page application: unknown paths return the app, which reads the hash route.
      try_files $uri /index.html;
    }
  }
}
